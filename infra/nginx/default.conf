map $uri $audit_path {
    "~^(?<short_path>.{0,200})" $short_path;
    default "";
}
log_format audit escape=json '{"timestamp":"$time_iso8601","request_id":"$request_id","service":"nginx","event_type":"http_request","source_ip":"$remote_addr","method":"$request_method","path":"$audit_path","status":$status,"result":"proxy"}';
access_log /dev/stdout audit;
# Nginx errors may echo raw request lines; application errors are logged by gateway.
error_log /dev/stderr crit;
server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    location / {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host gateway;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}
