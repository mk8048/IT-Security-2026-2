{% extends "base.html" %}
{% block title %}게시판{% endblock %}
{% block content %}
<h2>게시판</h2>
<table border="1">
  <tr><th>번호</th><th>제목</th><th>작성자</th><th>작성일</th></tr>
  {% for r in rows %}
  <tr>
    <td>{{ r.id }}</td>
    <td><a href="/board/{{ r.id }}">{{ r.title }}</a></td>
    <td>{{ r.author }}</td>
    <td>{{ r.created_at }}</td>
  </tr>
  {% endfor %}
</table>

<p><a href="/board/write">글쓰기</a></p>
{% endblock %}
