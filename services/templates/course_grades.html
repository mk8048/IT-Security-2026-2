{% extends "base.html" %}
{% block title %}성적 관리{% endblock %}
{% block content %}
{% if course %}
<label>과목:
  <select onchange="location.href='/courses/' + this.value + '/grades'">
    {% for c in g.nav_courses %}
      <option value="{{ c.id }}" {% if c.id == course.id %}selected{% endif %}>{{ c.code }} {{ c.title }}</option>
    {% endfor %}
  </select>
</label>

<h2>{{ course.code }} {{ course.title }}</h2>
<table border="1">
  <tr><th>학번(ID)</th><th>이름</th><th>점수</th><th>수정일</th><th>수정</th></tr>
  {% for r in rows %}
  <tr>
    <td>{{ r.username }}</td><td>{{ r.name }}</td><td>{{ r.score }}</td><td>{{ r.updated_at }}</td>
    <td>
      <form method="post" action="/grades/{{ r.id }}">
        <input name="score" size="4">
        <button>변경</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% else %}
<p>담당 과목이 없습니다.</p>
{% endif %}
{% endblock %}
