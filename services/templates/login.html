{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<h2>로그인</h2>
{% if error %}<pre style="color:#b00020">{{ error }}</pre>{% endif %}
{% if message %}<p style="color:#176b35">{{ message }}</p>{% endif %}
<form method="post" action="/login">
  <input name="username" placeholder="아이디"><br>
  <input name="password" type="password" placeholder="비밀번호"><br>
  <button type="submit">로그인</button>
</form>
<p><a href="/signup">회원가입</a></p>
<hr>
<h3>실습 DB 복구</h3>
<a href="/db/reset">DB 초기화 화면 열기</a>
{% endblock %}
