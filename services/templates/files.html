{% extends "base.html" %}
{% block title %}자료실{% endblock %}
{% block content %}
<h2>자료실</h2>
<table border="1">
  <tr><th>번호</th><th>파일명</th><th>설명</th><th>등록자</th></tr>
  {% for r in rows %}
  <tr>
    <td>{{ r.id }}</td>
    <td><a href="/files/download?name={{ r.filename|urlencode }}">{{ r.filename }}</a></td>
    <td>{{ r.description }}</td>
    <td>{{ r.uploader }}</td>
  </tr>
  {% endfor %}
</table>
<a href="/board">게시판</a>
{% endblock %}
